<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/png" href="/icone_mcs.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#030712" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Portal MCS" />
    <link rel="apple-touch-icon" href="/icone_mcs.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icone_mcs.png" />
    <link rel="apple-touch-startup-image" href="/imagem_loading.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Portal MCS</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #030712; color: #ffffff;">
    <div id="root">
      <div id="pwa-initial-splash" style="
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background-color: #030712;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        z-index: 999999;
      ">
        <img 
          src="/imagem_loading.png" 
          alt="Portal MCS" 
          style="
            width: 100%;
            height: 100%;
            max-width: 480px;
            max-height: 100vh;
            object-fit: contain;
            object-position: center;
            animation: splashPulse 1.8s ease-in-out infinite alternate;
          "
        />
        <style>
          @keyframes splashPulse {
            0% { opacity: 0.95; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.015); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
