<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>temp-app</title>
  </head>
  <body>
    <div id="error-log" style="color: red; padding: 20px; font-weight: bold; z-index: 9999; position: absolute;"></div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        document.getElementById('error-log').innerText += "\nERROR: " + msg + "\n" + (error ? error.stack : '');
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.getElementById('error-log').innerText += "\nPROMISE REJECTION: " + event.reason;
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
